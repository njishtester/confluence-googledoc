<!DOCTYPE html>
<html>
<head>
  <title>Confluence to Google Docs</title>
  <style>
    body {
      font-family: sans-serif;
      width: 300px;
      padding: 10px;
    }
    input {
      width: 100%;
      margin-bottom: 10px;
    }
    .info {
        font-size: 10px;
        color: #666;
        margin-top: -8px;
        margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Confluence Sync</h1>
  <div>
    <label for="confluence-url">Confluence URL:</label>
    <input type="text" id="confluence-url" placeholder="e.g., your-company.atlassian.net">
  </div>
  <div>
    <label for="confluence-email">Confluence Email:</label>
    <input type="email" id="confluence-email" placeholder="your.email@example.com">
  </div>
  <div>
    <label for="confluence-token">Confluence PAT:</label>
    <input type="password" id="confluence-token">
  </div>
  <div>
    <label for="confluence-targets">Space Key(s) or Parent Page ID(s):</label>
    <input type="text" id="confluence-targets" placeholder="e.g., CSTS, 431089988">
    <p class="info">Enter Space Keys (e.g., CSTS) for whole spaces, or Page IDs (e.g., 431089988) for a page and its children. Comma-separated.</p>
  </div>
  <div>
    <label>Save Destination:</label>
    <input type="radio" id="dest-gdrive" name="destination" value="gdrive" checked>
    <label for="dest-gdrive">Google Drive</label>
    <input type="radio" id="dest-local" name="destination" value="local">
    <label for="dest-local">Local Markdown (.md)</label>
  </div>
  <div id="gdrive-options">
    <label for="drive-folder">Google Drive Folder URL:</label>
    <input type="text" id="drive-folder">
  </div>
  <button id="save-settings">Save Settings</button>
  <button id="google-signin">Sign in with Google</button>
  <button id="start-sync">Start Sync</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
